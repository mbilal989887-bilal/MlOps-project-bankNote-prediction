data:
  source_file: data/source/BankNote_Authentication.csv
  raw_file: data/raw/banknote.csv
  target: class
  features: [variance, skewness, curtosis, entropy]

preprocessing:
  drop_duplicates: true
  test_size: 0.2
  random_state: 42

training:
  model_type: decision_tree        # decision_tree or random_forest
  random_state: 42
  cv_folds: 5
  decision_tree:
    max_depth: 5
    min_samples_split: 10
    min_samples_leaf: 5
  random_forest:
    n_estimators: 100
    max_depth: 5
    min_samples_split: 10
    min_samples_leaf: 5

evaluation:
  min_accuracy: 0.95               # pipeline fails if the model is worse than this

mlflow:
  experiment_name: banknote-authentication
  registered_model_name: banknote_auth_model

serving:
  # CHECK THIS against your dataset description (which class is genuine?)
  class_labels:
    0: Fake
    1: Genuine
  feature_ranges:
    variance: [-10, 10]
    skewness: [-20, 20]
    curtosis: [-10, 25]
    entropy: [-10, 5]
